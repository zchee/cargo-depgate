# Migration policy for uutils/coreutils@6341084, distilled from
# `.github/workflows/CICD.yml` L984-996, the "Verify ariadne is compiled out"
# step:
#
#   if cargo tree -p coreutils --no-default-features --features feat_os_unix \
#        -e normal -i ariadne 2>/dev/null; then ... exit 1; fi
#
# The fixture's metadata document is generated with `--all-features` (see
# scripts/fixture.sh), which is what the `features` key below requires: an
# activation walk narrows soundly only from a document that left no member's
# features off. The gate's own feature flags stay inert under `--metadata-json`;
# the selection that matters is the rule's.
#
# `features = ["feat_os_unix"]` is the flag pair above -- a list is resolved as
# `--no-default-features --features ...` -- so the rule asks the question the
# step asks, rooted at the same package, and passes.
#
# Without the key the same rule fires with
# `coreutils -> uucore -> ariadne (optional; present via workspace feature
# unification)`, and neither result is wrong. `uucore` declares `ariadne`
# optional behind its `diagnostics` feature, and the resolve is unified over
# every member, kind and platform, so the edge is in it twice over: this
# document activates every member's features, and even the flag pair upstream
# documents would leave it there, because `uu_csplit` and `uu_numfmt` request
# `uucore/diagnostics` from their `[dev-dependencies]` while the upstream
# command carries `-e normal`. The activation walk starts from `coreutils` and
# follows normal edges only, which is why it does not reach it.
schema = 1

# coreutils' root manifest names versions on its `uu_*` path dependencies
# because they are published to crates.io; that is a publishing requirement,
# not a policy deviation, so the default-on manifest rule is turned off.
[manifest]
versions-in-root = false

[rules.coreutils]
features = ["feat_os_unix"]
deny = ["ariadne"]
