name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --locked --all-features
      - run: cargo test --doc --locked
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check
      - name: Check committed fixture size
        shell: bash
        run: |
          test "$(du -sk tests/fixtures | awk '{print $1}')" -le 1536
          git ls-files --error-unmatch tests/fixtures/ganja-code-153bfb1/metadata.json.gz >/dev/null

  nightly:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --all-features

  perf:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: hyperfine
      - name: Install /usr/bin/time
        run: sudo apt-get install -y time
      - name: Check committed fixture size
        shell: bash
        run: |
          test "$(du -sk tests/fixtures | awk '{print $1}')" -le 1536
          git ls-files --error-unmatch tests/fixtures/ganja-code-153bfb1/metadata.json.gz >/dev/null
      - name: Run hermetic performance gates
        shell: bash
        run: bash scripts/perf.sh --profile ci
