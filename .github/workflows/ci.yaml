name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  stable:
    strategy:
      matrix:
        os: [ubuntu-26.04, xcode-27]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --locked --all-features
      - run: cargo test --doc --locked
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check
      - name: Check committed fixture size
        shell: bash
        run: |
          # Tracked bytes, not `du -sk`: block allocation is filesystem-dependent (ext4
          # charges a 4 KiB block per directory, APFS charges none), and tests/fixtures
          # now spans 155 directories, so the same tree measures ~1.4 MB on macOS and
          # ~2.0 MB on Linux. Bytes are the property this bound is actually about, and
          # counting only tracked files is what the repository pays for. 814,773 B today.
          test "$(git ls-files -z tests/fixtures | xargs -0 cat | wc -c | tr -d '[:space:]')" -le 1048576
          git ls-files --error-unmatch \
            tests/fixtures/lemmy-439734d/metadata.json.gz \
            tests/fixtures/ckb-17d7db5/metadata.json.gz \
            tests/fixtures/coreutils-6341084/metadata.json.gz >/dev/null
          # ckb is the one example whose config enables the manifest rule, so the gate
          # re-reads its member manifests: their absence would silently change the verdict.
          test "$(git ls-files 'tests/fixtures/ckb-17d7db5/' | grep -c '/Cargo\.toml$')" -eq 75

  nightly:
    runs-on: ubuntu-26.04
    env:
      RUSTUP_TOOLCHAIN: nightly
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --all-features

  perf:
    runs-on: ubuntu-26.04
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: hyperfine
      - name: Install /usr/bin/time
        run: sudo apt-get install -y time
      - name: Check committed fixture size
        shell: bash
        run: |
          # Tracked bytes, not `du -sk`: block allocation is filesystem-dependent (ext4
          # charges a 4 KiB block per directory, APFS charges none), and tests/fixtures
          # now spans 155 directories, so the same tree measures ~1.4 MB on macOS and
          # ~2.0 MB on Linux. Bytes are the property this bound is actually about, and
          # counting only tracked files is what the repository pays for. 814,773 B today.
          test "$(git ls-files -z tests/fixtures | xargs -0 cat | wc -c | tr -d '[:space:]')" -le 1048576
          git ls-files --error-unmatch \
            tests/fixtures/lemmy-439734d/metadata.json.gz \
            tests/fixtures/ckb-17d7db5/metadata.json.gz \
            tests/fixtures/coreutils-6341084/metadata.json.gz >/dev/null
          # ckb is the one example whose config enables the manifest rule, so the gate
          # re-reads its member manifests: their absence would silently change the verdict.
          test "$(git ls-files 'tests/fixtures/ckb-17d7db5/' | grep -c '/Cargo\.toml$')" -eq 75
      - name: Run hermetic performance gates
        shell: bash
        run: bash scripts/perf.sh --profile ci
