[package]
name = "cargo-depgate"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A high-performance dependency policy enforcer and CI gatekeeper for Cargo workspaces."
license = "Apache-2.0"
repository = "https://github.com/zchee/cargo-depgate"

# Stops cargo's upward workspace search. Without this, cargo walks past the repo
# root and picks up an unrelated manifest outside the repository, which fails
# every cargo invocation before it can start.
[workspace]

[lib]
name = "cargo_depgate"
path = "src/lib.rs"

[[bin]]
name = "cargo-depgate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap-cargo = { version = "0.19.0", features = ["cargo_metadata"] }
cargo_metadata = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
anstream = "1.0.0"
anstyle = "1.0.14"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
fixedbitset = "0.5.7"
rustc-hash = "2.1.3"
toml = { version = "1.1.4", features = ["preserve_order"] }
globset = "0.4.20"
schemars = "1.2.2"
indexmap = { version = "2.14.1", features = ["serde"] }
annotate-snippets = "0.12.16"

[dev-dependencies]
assert_cmd = "2.2.2"
guppy = "0.18.0"
tempfile = "3"
insta = { version = "1.48.0", features = ["filters"] }
divan = "0.1.21"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[[bench]]
name = "pipeline"
harness = false
# `cargo test` would otherwise run the bench binary as a test target and generate
# the full 112 MB synthetic input; nextest and CI never do, but a plain `cargo test` would.
test = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
expect_used = "warn"
module_name_repetitions = "allow"
